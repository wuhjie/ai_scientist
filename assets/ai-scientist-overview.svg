<svg xmlns="http://www.w3.org/2000/svg" width="453pt" height="177pt" viewBox="0 0 906 354" role="img" aria-labelledby="loop-title loop-desc" font-family="Helvetica, Arial, sans-serif">
<title id="loop-title">The Pass 3 epistemic loop</title>
<desc id="loop-desc">Scientific claims and state receive evidence, evidence is adjudicated, and an update either changes an output or changes the represented epistemic state. Provenance records who produced and checked the evidence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#245EA8"/></marker></defs>
<rect width="906" height="354" fill="#FFFFFF"/>
<text x="24" y="27" font-size="13" fill="#245EA8" font-weight="700" text-anchor="start">EPISTEMIC CONTROL · PASS 3</text>
<text x="882" y="27" font-size="13" fill="#768399" font-weight="600" text-anchor="end">H/S → E → A → U</text>
<rect x="24" y="50" width="184" height="154" rx="8" fill="#FFFFFF" stroke="#D7DEE9" stroke-width="2"/>
<rect x="24" y="50" width="184" height="34" rx="8" fill="#EAF1FA"/>
<rect x="24" y="76" width="184" height="8" fill="#EAF1FA"/>
<text x="38" y="73" font-size="14" fill="#172033" font-weight="700" text-anchor="start">CLAIM + STATE</text>
<text x="194" y="73" font-size="14" fill="#245EA8" font-weight="700" text-anchor="end">H / S</text>
<rect x="228" y="50" width="166" height="154" rx="8" fill="#FFFFFF" stroke="#D7DEE9" stroke-width="2"/>
<rect x="228" y="50" width="166" height="34" rx="8" fill="#EAF1FA"/>
<rect x="228" y="76" width="166" height="8" fill="#EAF1FA"/>
<text x="242" y="73" font-size="14" fill="#172033" font-weight="700" text-anchor="start">EVIDENCE</text>
<text x="380" y="73" font-size="14" fill="#245EA8" font-weight="700" text-anchor="end">E</text>
<rect x="414" y="50" width="188" height="154" rx="8" fill="#FFFFFF" stroke="#D7DEE9" stroke-width="2"/>
<rect x="414" y="50" width="188" height="34" rx="8" fill="#EAF1FA"/>
<rect x="414" y="76" width="188" height="8" fill="#EAF1FA"/>
<text x="428" y="73" font-size="14" fill="#172033" font-weight="700" text-anchor="start">ADJUDICATION</text>
<text x="588" y="73" font-size="14" fill="#245EA8" font-weight="700" text-anchor="end">A</text>
<rect x="622" y="50" width="260" height="154" rx="8" fill="#FFFFFF" stroke="#D7DEE9" stroke-width="2"/>
<rect x="622" y="50" width="260" height="34" rx="8" fill="#EAF1FA"/>
<rect x="622" y="76" width="260" height="8" fill="#EAF1FA"/>
<text x="636" y="73" font-size="14" fill="#172033" font-weight="700" text-anchor="start">UPDATE</text>
<text x="868" y="73" font-size="14" fill="#245EA8" font-weight="700" text-anchor="end">U</text>
<line x1="212" y1="127" x2="223" y2="127" stroke="#245EA8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="398" y1="127" x2="409" y2="127" stroke="#245EA8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="606" y1="127" x2="617" y2="127" stroke="#245EA8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="107" font-size="15" fill="#245EA8" font-weight="700" text-anchor="start">H0–H3</text>
<text x="99" y="107" font-size="15" fill="#172033" font-weight="600" text-anchor="start">claim form</text>
<text x="40" y="137" font-size="15" fill="#245EA8" font-weight="700" text-anchor="start">S0–S4</text>
<text x="99" y="137" font-size="15" fill="#172033" font-weight="600" text-anchor="start">scientific state</text>
<text x="40" y="171" font-size="13" fill="#526076" font-weight="400" text-anchor="start">What claim exists, and what</text>
<text x="40" y="188" font-size="13" fill="#526076" font-weight="400" text-anchor="start">persists between actions?</text>
<text x="244" y="105" font-size="13" fill="#768399" font-weight="700" text-anchor="start">E0</text>
<text x="280" y="105" font-size="14" fill="#172033" font-weight="500" text-anchor="start">none</text>
<text x="244" y="128" font-size="13" fill="#768399" font-weight="700" text-anchor="start">E1</text>
<text x="280" y="128" font-size="14" fill="#172033" font-weight="500" text-anchor="start">literature</text>
<text x="244" y="151" font-size="13" fill="#768399" font-weight="700" text-anchor="start">E2–E3</text>
<text x="300" y="151" font-size="14" fill="#172033" font-weight="500" text-anchor="start">execution · data</text>
<text x="244" y="174" font-size="13" fill="#768399" font-weight="700" text-anchor="start">E4–E5</text>
<text x="300" y="174" font-size="14" fill="#172033" font-weight="500" text-anchor="start">physical · formal</text>
<text x="430" y="105" font-size="13" fill="#768399" font-weight="700" text-anchor="start">A0</text>
<text x="468" y="105" font-size="14" fill="#172033" font-weight="500" text-anchor="start">none</text>
<text x="430" y="128" font-size="13" fill="#768399" font-weight="700" text-anchor="start">A1</text>
<text x="468" y="128" font-size="14" fill="#172033" font-weight="500" text-anchor="start">model / peer</text>
<text x="430" y="151" font-size="13" fill="#768399" font-weight="700" text-anchor="start">A2–A3</text>
<text x="490" y="151" font-size="14" fill="#172033" font-weight="500" text-anchor="start">metric · statistics</text>
<text x="430" y="174" font-size="13" fill="#768399" font-weight="700" text-anchor="start">A4–A5</text>
<text x="490" y="174" font-size="14" fill="#172033" font-weight="500" text-anchor="start">formal · expert</text>
<rect x="636" y="96" width="108" height="91" rx="5" fill="#F5F7FA"/>
<text x="648" y="116" font-size="14" fill="#526076" font-weight="700" text-anchor="start">U0–U3</text>
<text x="648" y="138" font-size="13" fill="#526076" font-weight="600" text-anchor="start">operational</text>
<text x="648" y="153" font-size="12.5" fill="#768399" font-weight="400" text-anchor="start">none · select</text>
<text x="648" y="169" font-size="12.5" fill="#768399" font-weight="400" text-anchor="start">regenerate</text>
<text x="648" y="185" font-size="12.5" fill="#768399" font-weight="400" text-anchor="start">append</text>
<rect x="756" y="96" width="112" height="91" rx="5" fill="#EAF1FA" stroke="#245EA8"/>
<text x="768" y="116" font-size="14" fill="#245EA8" font-weight="700" text-anchor="start">U4–U6</text>
<text x="768" y="138" font-size="13" fill="#245EA8" font-weight="600" text-anchor="start">epistemic</text>
<text x="768" y="153" font-size="12.5" fill="#172033" font-weight="400" text-anchor="start">revise claim</text>
<text x="768" y="169" font-size="12.5" fill="#172033" font-weight="400" text-anchor="start">revise strength</text>
<text x="768" y="185" font-size="12.5" fill="#172033" font-weight="400" text-anchor="start">eliminate</text>
<path d="M 812 205 L 812 232 L 116 232 L 116 210" fill="none" stroke="#245EA8" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="464" y="226" font-size="13" fill="#245EA8" font-weight="600" text-anchor="middle">an epistemic update changes the represented claim or state</text>
<rect x="228" y="254" width="374" height="54" rx="7" fill="#F5F7FA" stroke="#D7DEE9" stroke-dasharray="5 4"/>
<text x="244" y="276" font-size="13" fill="#526076" font-weight="700" text-anchor="start">PROVENANCE · P</text>
<text x="244" y="296" font-size="11.5" fill="#172033" font-weight="500" text-anchor="start">internal · developer · collaborator · external scorer · independent verifier</text>
<line x1="312" y1="254" x2="312" y2="210" stroke="#D7DEE9" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="508" y1="254" x2="508" y2="210" stroke="#D7DEE9" stroke-width="2" stroke-dasharray="4 4"/>
<text x="453" y="337" font-size="14" fill="#526076" font-weight="600" text-anchor="middle" font-style="italic">Generation is not revision: only U4–U6 alter an explicit claim-level epistemic variable.</text>
</svg>
