<text x="30" y="344" font-size="12" fill="#768399" font-weight="400" text-anchor="start">re-runs outside the team</text>
<circle cx="286" cy="328" r="8" fill="#245EA8"/>
<circle cx="424" cy="328" r="8" fill="#245EA8"/>
<circle cx="562" cy="328" r="8" fill="#245EA8"/>
<circle cx="700" cy="328" r="8" fill="#245EA8"/>
<circle cx="838" cy="328" r="8" fill="#245EA8"/>
<line x1="20" y1="352" x2="882" y2="352" stroke="#D7DEE9"/>
<circle cx="32" cy="372" r="6" fill="#245EA8"/>
<text x="45" y="376" font-size="12" fill="#526076" font-weight="500" text-anchor="start">direct target</text>
<circle cx="168" cy="372" r="6" fill="#FFFFFF" stroke="#768399" stroke-width="2"/>
<text x="181" y="376" font-size="12" fill="#526076" font-weight="500" text-anchor="start">reported or indirect</text>
<line x1="354" y1="372" x2="366" y2="372" stroke="#D7DEE9" stroke-width="2"/>
<text x="378" y="376" font-size="12" fill="#526076" font-weight="500" text-anchor="start">generally outside scope</text>
<text x="882" y="376" font-size="12" fill="#768399" font-weight="400" text-anchor="end" font-style="italic">coverage varies by implementation</text>
</svg>
